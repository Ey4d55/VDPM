<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="VDPM-RaceTwin: interactive, physics-constrained screening of Formula 1 aerodynamic setups, accompanying the VDPM manuscript." />
    <meta name="color-scheme" content="dark light" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <title>VDPM-RaceTwin</title>
    <script>
      try {
        var t = localStorage.getItem("vdpm-racetwin/theme");
        if (!t) t = window.matchMedia && window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
        document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>VDPM-RaceTwin needs JavaScript to run the model in your browser.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
