[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "vdpm"
version = "0.1.0"
description = "Vehicle Dynamics Performance Metric: physics-constrained, circuit-aware screening of Formula 1 aerodynamic setups"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []
classifiers = [
    "Programming Language :: Python :: 3",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Physics",
]

[project.optional-dependencies]
research = ["numpy>=1.24", "matplotlib>=3.7"]
dev = ["pytest>=8", "hypothesis>=6", "ruff>=0.5", "mypy>=1.10", "numpy>=1.24", "matplotlib>=3.7"]

[project.scripts]
vdpm = "vdpm.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/vdpm"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "N"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.mypy]
python_version = "3.10"
strict = true
mypy_path = "src"
packages = ["vdpm"]
